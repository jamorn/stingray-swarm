<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Stingray Swarm - Polimaxx Interactive Env</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <button id="mode-toggle" aria-label="Toggle day/night mode">
    <span id="mode-icon">🌙</span>
    <span id="mode-text">Dark Mode</span>
  </button>

  <div id="devInfo">👨‍💻 Developer: likit_se@irpc.co.th</div>

  <div id="controlHints" class="control-hints" aria-hidden="false">
    <div class="hint-icon">
      <div class="mouse-icon" id="mouseIcon">
        <div class="mouse-body"></div>
        <div class="mouse-wheel"></div>
      </div>
      <div class="touch-icon hidden" id="touchIcon">
        <div class="finger"></div>
        <div class="finger finger-2"></div>
      </div>
      <div class="tablet-icon hidden" id="tabletIcon">
        <div class="tablet-body"></div>
        <div class="tablet-finger"></div>
        <div class="tablet-finger tablet-finger-2"></div>
      </div>
      <div class="hybrid-icon hidden" id="hybridIcon">
        <div class="hybrid-mouse"></div>
        <div class="hybrid-touch"><div class="hybrid-finger"></div></div>
      </div>
    </div>
    <div class="hint-text">
      <span id="pcHint">Left click + drag to rotate<br>Scroll to zoom</span>
      <span id="mobileHint" class="hidden">Touch + drag to rotate<br>2 fingers to zoom</span>
      <span id="tabletHint" class="hidden">Touch + drag to rotate<br>Pinch to zoom</span>
      <span id="hybridHint" class="hidden">Mouse/Touch + drag to rotate<br>Scroll/Pinch to zoom</span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19"></script>

  <script src="js/config.js"></script>
  <script src="js/texture.js"></script>
  <script src="js/stingray.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
